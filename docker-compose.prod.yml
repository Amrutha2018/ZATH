# Production override for server deployment
# Use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
# Set SERVER_IP environment variable: export SERVER_IP=31.97.229.227

services:
  zathfrontend:
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://${SERVER_IP:-31.97.229.227}:8001
    # Production-specific settings
    volumes:
      - ./zath_frontend:/app
      - /app/node_modules
    # Remove development-specific volume mounts
    restart: always

  zathapi:
    # Production-specific settings
    environment:
      - ENVIRONMENT=production
      - PYTHONPATH=/app
    restart: always

  worker:
    # Production-specific settings
    environment:
      - ENVIRONMENT=production
      - PYTHONPATH=/app
    restart: always

