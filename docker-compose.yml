services:
  redis:
    image: redis:7
    container_name: zath-redis
    ports:
      - "6379:6379"
    restart: always

  postgres:
    image: postgres:15
    container_name: zath-postgres
    environment:
      POSTGRES_DB: zathdb
      POSTGRES_USER: zathuser
      POSTGRES_PASSWORD: zathpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  zathapi:
    build:
      context: ./zath_api
    container_name: zath-api
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
    volumes:
      - ./zath_api:/app
    env_file:
      - .env
    restart: always

  worker:
    build:
      context: ./zath_api
    container_name: zath-worker
    command: ["python", "workers/run_worker.py"]
    depends_on:
      - redis
      - postgres
    volumes:
      - ./zath_api:/app
    env_file:
      - .env
    restart: always

  zathfrontend:
    build:
      context: ./zath_frontend
    container_name: zath-frontend
    ports:
      - "3000:3000"
    depends_on:
      - zathapi
    volumes:
      - ./zath_frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: always

volumes:
  postgres_data:
